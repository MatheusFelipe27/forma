server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A barra final no proxy_pass remove o prefixo /api:
  # /api/auth/login  ->  backend:3333/auth/login
  location /api/ {
    proxy_pass http://backend:3333/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: qualquer rota do React Router cai no index.html, senão um F5 em
  # /meus-treinamentos devolveria 404 do nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
